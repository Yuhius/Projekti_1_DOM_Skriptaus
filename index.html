<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Tehtävä-lista</h1>

    <p>Tähän sovellukseen lisätään omia tehtäviä ja määritellään niille määräpäivä.
        Syötä Tehtävä -kohtaan tehtävän nimi ja Määräpäivä-kohtaan päivä mihin mennessä tehtävä pitää olla suoritettu.
    </p>

    <form id="todoForm">
        <div>
            <label for="todoTask">Tehtävä:</label>

            <input
                type="text"
                id="todoTask"
                name="todoTask"
                >
        </div>
        
        <div>
            <label for="todoDate">Määräpäivä:</label>

            <input
                type="date"
                id="todoDate"
                name="todoDate"
                >
        </div>
        
        <button type="submit">Lisää</button>

        <p id="errorMessage"></p>
    </form>

    

    <table id="taskTable">
        <thead>
            <tr>
                <th>Tehtävä</th>
                <th>Määräpäivä</th>
                <th>Valmis/Poista</th>
            </tr>
        </thead>
        <tbody id="taskTableBody"></tbody>
    </table>
    <br>
    <button id="saveButton">Tallenna</button>
    <button id="loadButton">Lataa</button>
</body>
</html>
